name: Build and Push sqlx-cli

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -f Dockerfile.sqlx \
            -t ghcr.io/austin-rgb/sqlx-cli:latest \
            .

      - name: Push image
        run: |
          docker push \
            ghcr.io/austin-rgb/sqlx-cli:latest
