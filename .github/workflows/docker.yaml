name: Build and Push Docker Image

on:
  push:
    branches: [ "master" ]

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Extract metadata (tags)
        id: meta
        run: |
          IMAGE=ghcr.io/austin-rgb/actix-ecommerce
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "sha_tag=${IMAGE}:${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "latest_tag=${IMAGE}:latest" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t ${{ steps.meta.outputs.latest_tag }} \
            -t ${{ steps.meta.outputs.sha_tag }} \
            .

          docker push ${{ steps.meta.outputs.latest_tag }}
          docker push ${{ steps.meta.outputs.sha_tag }}